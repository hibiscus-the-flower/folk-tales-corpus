<h2>90. Bird Arinto. [Story]</h2>
<p class="first">Jekyll, 54–57, Man-Crow, tells the same story. See also numbers 70 and 89.
</p>
<p>The story occurs as an episode in Zeltner’s Kama, 54–61 and Tremearne’s How Auta Killed
Dodo, 408–412.
</p>
<p>For the golden tongue and teeth see numbers 90, 95, and Jekyll, 56; and compare Zeltner, 5.

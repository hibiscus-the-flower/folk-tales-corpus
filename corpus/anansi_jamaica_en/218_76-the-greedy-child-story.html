<h2>76. The Greedy Child. [Story]</h2>
<p class="first">The idea of a water spirit who allows no one to cross a river without an offering
of food, seems to be common in West Africa; e.g. Dayrell, 107–114. Jekyll, 100–101,
Dry River, has a Jamaica version of this story. Compare also Tremearne, 209–210, 307–314.
</p>

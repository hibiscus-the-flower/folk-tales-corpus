<h2>THE BLUE BIRD (II.).</h2>
<p>This totally different ballad is from Neus, <i>Ehstnische Volkslieder</i>, p.
42. Neus quotes Ganander as saying that one of the names of the Finnish
Wood-goddess (the spouse of Tapio) is Blue Bird. The present poem is
<i>possibly</i> a fragment of a creation-myth.</p>

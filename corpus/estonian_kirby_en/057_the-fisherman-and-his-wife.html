<h2>THE FISHERMAN AND HIS WIFE.</h2>
<p>Kreutzwald's story of "The Powerful Crayfish and the Insatiable Wife" is
almost identical with that of Grimm. At last the woman wishes to be God,
and the crayfish sends the foolish couple back to their poverty.</p>

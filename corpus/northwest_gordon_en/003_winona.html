<h2>WINONA.</h2>
<p>
      (In pronouncing Dakota words give "a" the sound of "ah,"—"e" the
      sound of "a,"—"i" the sound of "e" and "u" the sound of "oo." Sound
      "ee" the same as in English. The numerals 1-2 etc. refer to notes in the
      appendix).

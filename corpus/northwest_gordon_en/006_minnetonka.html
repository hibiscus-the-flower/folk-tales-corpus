<h2>MINNETONKA</h2>
<p>
      Note: The Dakota name for this beautiful lake is <i>Me-ne-a-tan-ka</i>—Broad
      Water. By dropping the a before tánka, we have changed the name to <i>Big
      Water</i>.
    </p>

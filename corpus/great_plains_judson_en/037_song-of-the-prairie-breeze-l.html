<h2>SONG OF THE PRAIRIE BREEZE[L]</h2>
<p class="subtitle">Kiowa</p>
<p>“To the familiar, this little song brings up pleasant memories of
the prairie camp when the wind is whistling through the tipi poles
and blowing the flaps about, while inside the fire burns bright and
the song and the game go round.”</p>
<p><a href="2063022261517184971_22083-h-2.htm.html#FNanchor_L_12" class="pginternal"><span class="label">[L]</span> James Mooney.</p>

<h2>GIANTS.</h2>
<p>When the pagan gods of Ireland—the <i>Tuath-De-Danān</i>—robbed
of worship and offerings, grew smaller and smaller in
the popular imagination, until they turned into the fairies, the
pagan heroes grew bigger and bigger, until they turned into the
giants.</p>
